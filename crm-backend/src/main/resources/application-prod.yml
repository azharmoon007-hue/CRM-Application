spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  cache:
    type: redis

logging:
  level:
    root: INFO
    com.example.crm: INFO
    org.springframework.web: WARN
