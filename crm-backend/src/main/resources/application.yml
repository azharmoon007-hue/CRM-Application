server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

crm:
  redis-enabled: ${CRM_REDIS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
  jwt:
    secret: ${JWT_SECRET:ThisIsADevelopmentOnlySecretKeyThatIsAtLeast256BitsLongCrmJwt!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    local-path: ${FILE_STORAGE_PATH:./uploads}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@crm.local}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    admin-first-name: Super
    admin-last-name: Admin
  scheduler:
    enabled: ${CRM_SCHEDULER_ENABLED:true}
    overdue-tasks-cron: ${CRM_OVERDUE_TASKS_CRON:0 0 * * * *}
    task-reminders-cron: ${CRM_TASK_REMINDERS_CRON:0 0/15 * * * *}
    follow-up-cron: ${CRM_FOLLOW_UP_CRON:0 0/30 * * * *}
    deal-close-cron: ${CRM_DEAL_CLOSE_CRON:0 0 8 * * *}
    lead-follow-up-cron: ${CRM_LEAD_FOLLOW_UP_CRON:0 0 9 * * *}
    token-cleanup-cron: ${CRM_TOKEN_CLEANUP_CRON:0 0 3 * * *}
    daily-sales-cron: ${CRM_DAILY_SALES_CRON:0 0 18 * * *}
  mail:
    from: ${MAIL_FROM:noreply@crm.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
